# Gitleaks policy: default ruleset plus reviewed non-secret allowlists.
# Every entry here must name WHY the match is not a secret. Real secrets are
# never allowlisted — rotate and purge instead.
title = "wheres_the_car gitleaks config"

[extend]
useDefault = true

[[allowlists]]
description = "FlutterFire-generated client config: Firebase apiKey values are public app identifiers (shipped inside every app binary), not bearer secrets; access is governed by Firebase security rules."
paths = ['''app/lib/firebase_options\.dart$''']

[[allowlists]]
description = "Synthetic install-token fixtures (0123..abcdef patterns) used by router Firebase auth tests; not real credentials."
paths = ['''services/router/firebase_service_test\.go$''']
