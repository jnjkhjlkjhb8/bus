name: build-images

on:
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-images-${{ github.event.workflow_run.head_sha || github.sha }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAMESPACE: ${{ github.repository_owner }}

jobs:
  build-router:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
      image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/bus-router
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      - uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4.4.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: build and push
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: services/api/Dockerfile
          push: true
          provenance: true
          sbom: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/bus-router:sha-${{ github.event.workflow_run.head_sha || github.sha }}
      - name: attest build provenance
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/bus-router
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

  build-functions:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
      image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/bus-functions
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      - uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4.4.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: build and push
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: services/worker/Dockerfile
          push: true
          provenance: true
          sbom: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/bus-functions:sha-${{ github.event.workflow_run.head_sha || github.sha }}
      - name: attest build provenance
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/bus-functions
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

  manifest:
    needs: [build-router, build-functions]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: write release manifest
        env:
          COMMIT_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
          RUN_ID: ${{ github.run_id }}
          ROUTER_REF: ${{ needs.build-router.outputs.image }}@${{ needs.build-router.outputs.digest }}
          FUNCTIONS_REF: ${{ needs.build-functions.outputs.image }}@${{ needs.build-functions.outputs.digest }}
        run: |
          cat > release-manifest.json <<EOF
          {
            "commit": "$COMMIT_SHA",
            "run_id": "$RUN_ID",
            "images": {
              "router": "$ROUTER_REF",
              "functions": "$FUNCTIONS_REF"
            }
          }
          EOF
          cat release-manifest.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-manifest
          path: release-manifest.json
          retention-days: 90
