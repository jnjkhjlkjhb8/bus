name: deploy-prod

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to deploy (vX.Y.Z); must already have a green build-images run"
        required: true

permissions:
  contents: read

concurrency:
  group: deploy-prod
  cancel-in-progress: false

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    outputs:
      sha: ${{ steps.manifest.outputs.commit }}
      router: ${{ steps.manifest.outputs.router }}
      functions: ${{ steps.manifest.outputs.functions }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
      - name: validate and resolve tag
        id: tag
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_TAG: ${{ github.event.inputs.tag }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            deploy_tag="$INPUT_TAG"
          else
            deploy_tag="$REF_NAME"
          fi
          if [[ ! "$deploy_tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::refusing to deploy: tag '$deploy_tag' does not match ^v[0-9]+\.[0-9]+\.[0-9]+\$" >&2
            exit 1
          fi
          git fetch origin "refs/tags/$deploy_tag:refs/tags/$deploy_tag"
          sha=$(git rev-list -n1 "refs/tags/$deploy_tag")
          echo "tag=$deploy_tag" >> "$GITHUB_OUTPUT"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
      - name: verify tag commit is on main
        env:
          TAG_SHA: ${{ steps.tag.outputs.sha }}
        run: |
          git fetch origin main
          if ! git merge-base --is-ancestor "$TAG_SHA" FETCH_HEAD; then
            echo "::error::tag commit $TAG_SHA is not an ancestor of origin/main -- refusing to deploy an unmerged commit to production" >&2
            exit 1
          fi
      - name: verify commit was deployed to staging
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EVENT_NAME: ${{ github.event_name }}
          TAG_SHA: ${{ steps.tag.outputs.sha }}
        run: |
          # workflow_dispatch is the operator escape hatch: a manually
          # dispatched staging deploy records main's tip as its head_sha, so
          # a commit that only ever reached staging that way is invisible to
          # this check. The operator confirming staging health and
          # dispatching deploy-prod by hand takes responsibility instead.
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            echo "::warning::workflow_dispatch deploy: skipping the staging-deployment check; confirm staging ran this commit before approving"
            exit 0
          fi
          staging_run=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow deploy-staging.yaml \
            --limit 100 --json databaseId,headSha,conclusion \
            | jq -r --arg sha "$TAG_SHA" '[.[] | select(.headSha == $sha and .conclusion == "success")][0].databaseId')
          if [ -z "$staging_run" ] || [ "$staging_run" = "null" ]; then
            echo "::error::no successful deploy-staging run found for commit $TAG_SHA -- it must be deployed to staging before it can go to production" >&2
            exit 1
          fi
          echo "commit $TAG_SHA was deployed to staging by deploy-staging run $staging_run"
      - name: find build-images run for this commit
        id: run
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_SHA: ${{ steps.tag.outputs.sha }}
        run: |
          run_id=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow build-images.yaml \
            --limit 100 --json databaseId,headSha,conclusion \
            | jq -r --arg sha "$TAG_SHA" '[.[] | select(.headSha == $sha and .conclusion == "success")][0].databaseId')
          if [ -z "$run_id" ] || [ "$run_id" = "null" ]; then
            echo "::error::no successful build-images run found for commit $TAG_SHA -- it must build and publish images before it can go to production" >&2
            exit 1
          fi
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-manifest
          run-id: ${{ steps.run.outputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: read release manifest
        id: manifest
        env:
          TAG_SHA: ${{ steps.tag.outputs.sha }}
        run: |
          commit=$(jq -r '.commit' release-manifest.json)
          router=$(jq -r '.images.router' release-manifest.json)
          functions=$(jq -r '.images.functions' release-manifest.json)
          if [ "$commit" != "$TAG_SHA" ]; then
            echo "::error::release-manifest commit ($commit) does not match the deployed tag's commit ($TAG_SHA)" >&2
            exit 1
          fi
          {
            echo "commit=$commit"
            echo "router=$router"
            echo "functions=$functions"
          } >> "$GITHUB_OUTPUT"

  deploy:
    needs: gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    permissions:
      contents: read
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@029f5b4aeeeb58fdfe1410a5d17f967dacf36262 # v1.0.3
        env:
          DEPLOY_SHA: ${{ needs.gate.outputs.sha }}
          ROUTER_IMAGE: ${{ needs.gate.outputs.router }}
          FUNCTIONS_IMAGE: ${{ needs.gate.outputs.functions }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          fingerprint: ${{ secrets.SSH_HOST_FINGERPRINT }}
          envs: DEPLOY_SHA,ROUTER_IMAGE,FUNCTIONS_IMAGE
          script: |
            set -e
            cd "${{ secrets.DEPLOY_PATH }}"
            git fetch origin "$DEPLOY_SHA"
            git checkout --detach "$DEPLOY_SHA"
            ./scripts/deploy-transaction.sh prod "$ROUTER_IMAGE" "$FUNCTIONS_IMAGE"
