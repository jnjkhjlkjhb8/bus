name: ci

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: bus_test
          POSTGRES_USER: bus
          POSTGRES_PASSWORD: bus
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U bus -d bus_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
    env:
      DATABASE_URL: postgres://bus:bus@localhost:5432/bus_test?sslmode=disable
      REDIS_ADDR: localhost:6379
      PG_SCHEMA: public
      FIREBASE_ENABLED: "false"
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
      - run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - name: generate pinned protobuf stubs
        run: make proto-go
      - run: go vet ./...
      - run: go install gotest.tools/gotestsum@v1.12.3
      - run: gotestsum --junitfile junit.xml -- -race -coverprofile=coverage.out ./...
      - uses: codecov/codecov-action@0fb7174895f61a3b6b78fc075e0cd60383518dac # v5
        if: ${{ !cancelled() }}
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage.out
          flags: go
      - uses: codecov/test-results-action@0fa95f0e1eeaafde2c782583b36b28ad0d8c77d3 # v1
        if: ${{ !cancelled() }}
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: junit.xml
          flags: go
      # Engineering-contract gates that need generated stubs and the live
      # postgres/redis services this job already provides. Tool versions are
      # pinned inside the scripts (installed into .tools/bin, never @latest).
      - name: guardrail tests still present and passing
        run: ./scripts/check-guardrail-tests-present.sh
      - name: govulncheck (pinned SCA gate)
        run: ./scripts/check-govulncheck.sh

  contracts:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          # buf breaking diffs the proto contract against the PR base ref,
          # which requires history beyond the merge commit.
          fetch-depth: 0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
      - name: dependency boundaries (features / proto confinement / Go layering)
        run: ./scripts/check-dependency-boundaries.sh
      - name: dependency-boundary scanner self-test
        run: ./scripts/check-dependency-boundaries.sh --self-test
      - name: file-size ratchet
        run: ./scripts/check-file-budgets.sh
      - name: file-size ratchet self-test
        run: ./scripts/check-file-budgets.sh --self-test
      - name: proto contract (buf build + breaking, pinned)
        env:
          # Enforce wire compatibility against the PR base; on branch pushes
          # HEAD makes the diff a no-op and the gate reduces to `buf build`.
          PROTO_BASELINE_REF: ${{ github.event.pull_request.base.sha || 'HEAD' }}
        run: ./scripts/check-proto-contract.sh

  security:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          # gitleaks scans commit history, not just the checkout tip.
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Repo-root .gitleaks.toml (default rules + reviewed non-secret
          # allowlists) is auto-detected by gitleaks.

  flutter:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          cache: true
      - run: dart pub global activate protoc_plugin 25.0.0
      - run: dart pub global activate junitreport
      - run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - run: echo "$HOME/.pub-cache/bin" >> "$GITHUB_PATH"
      - run: mkdir -p app/lib/data/generated
      - run: protoc --dart_out=grpc:app/lib/data/generated -I models models/*.proto
      - run: flutter pub get
        working-directory: app
      # app/assets is gitignored and owner-provided (real sprite/font/marker
      # binaries, not derivable from source). This job does NOT fabricate
      # placeholder files for them — a runner with no assets provisioned is
      # expected to fail flutter analyze/test here, and that failure means
      # "the asset gate needs owner-provided real assets," not "the workflow
      # is broken." See scripts/check-hermetic.sh check (b).
      - run: flutter analyze --no-fatal-infos
        working-directory: app
      - run: flutter test --coverage --file-reporter=json:test-results.json
        working-directory: app
      - run: tojunit --input test-results.json --output junit.xml
        if: ${{ !cancelled() }}
        working-directory: app
      - uses: codecov/codecov-action@0fb7174895f61a3b6b78fc075e0cd60383518dac # v5
        if: ${{ !cancelled() }}
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: app/coverage/lcov.info
          flags: flutter
      - uses: codecov/test-results-action@0fa95f0e1eeaafde2c782583b36b28ad0d8c77d3 # v1
        if: ${{ !cancelled() }}
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: app/junit.xml
          flags: flutter
