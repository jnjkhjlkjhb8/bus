name: ci

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  go:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: bus_test
          POSTGRES_USER: bus
          POSTGRES_PASSWORD: bus
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U bus -d bus_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
    env:
      DATABASE_URL: postgres://bus:bus@localhost:5432/bus_test?sslmode=disable
      REDIS_ADDR: localhost:6379
      PG_SCHEMA: public
      FIREBASE_ENABLED: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - run: |
          go install google.golang.org/protobuf/cmd/protoc-gen-go@latest
          go install google.golang.org/grpc/cmd/protoc-gen-go-grpc@latest
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - run: protoc --go_out=paths=source_relative:models --go-grpc_out=paths=source_relative:models -I models models/*.proto
      - run: go vet ./...
      - run: go install gotest.tools/gotestsum@latest
      - run: gotestsum --junitfile junit.xml -- -race -coverprofile=coverage.out ./...
      - uses: codecov/codecov-action@v5
        if: ${{ !cancelled() }}
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage.out
          flags: go
      - uses: codecov/test-results-action@v1
        if: ${{ !cancelled() }}
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: junit.xml
          flags: go

  flutter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: dart pub global activate protoc_plugin
      - run: dart pub global activate junitreport
      - run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - run: echo "$HOME/.pub-cache/bin" >> "$GITHUB_PATH"
      - run: mkdir -p app/lib/data/generated
      - run: protoc --dart_out=grpc:app/lib/data/generated -I models models/*.proto
      - run: flutter pub get
        working-directory: app
      - run: flutter analyze --no-fatal-infos
        working-directory: app
      - name: stub gitignored assets
        working-directory: app
        run: |
          mkdir -p assets/fonts assets/marker assets/sprites assets/rails \
            assets/mrt/TRTC assets/mrt/KRTC assets/mrt/KLRT
          touch assets/grpc.crt \
            assets/fonts/IBMPlexSans.ttf assets/fonts/IBMPlexMono-Regular.ttf
          for d in marker sprites rails mrt mrt/TRTC mrt/KRTC mrt/KLRT; do
            touch "assets/$d/stub"
          done
      - run: flutter test --coverage --file-reporter=json:test-results.json
        working-directory: app
      - run: tojunit --input test-results.json --output junit.xml
        if: ${{ !cancelled() }}
        working-directory: app
      - uses: codecov/codecov-action@v5
        if: ${{ !cancelled() }}
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: app/coverage/lcov.info
          flags: flutter
      - uses: codecov/test-results-action@v1
        if: ${{ !cancelled() }}
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: app/junit.xml
          flags: flutter
