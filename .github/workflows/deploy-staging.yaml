name: deploy-staging

on:
  workflow_run:
    workflows: [build-images]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-staging
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: staging
    permissions:
      contents: read
      actions: read
    steps:
      - name: resolve build-images run
        id: run
        env:
          EVENT_NAME: ${{ github.event_name }}
          WORKFLOW_RUN_ID: ${{ github.event.workflow_run.id }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            # Manual redeploy: find the most recent successful build-images
            # run for the current default branch tip instead of requiring
            # the operator to hunt down a run id.
            run_id=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow build-images.yaml \
              --status success --branch main --limit 1 --json databaseId --jq '.[0].databaseId')
            if [ -z "$run_id" ] || [ "$run_id" = "null" ]; then
              echo "::error::no successful build-images run found on main" >&2
              exit 1
            fi
            echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
          else
            echo "run_id=$WORKFLOW_RUN_ID" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-manifest
          run-id: ${{ steps.run.outputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: read release manifest
        id: manifest
        env:
          EVENT_NAME: ${{ github.event_name }}
          WORKFLOW_RUN_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          commit=$(jq -r '.commit' release-manifest.json)
          router=$(jq -r '.images.router' release-manifest.json)
          functions=$(jq -r '.images.functions' release-manifest.json)
          if [ "$EVENT_NAME" != "workflow_dispatch" ] && [ "$commit" != "$WORKFLOW_RUN_SHA" ]; then
            echo "::error::release-manifest commit ($commit) does not match the triggering build-images run's head_sha ($WORKFLOW_RUN_SHA)" >&2
            exit 1
          fi
          {
            echo "commit=$commit"
            echo "router=$router"
            echo "functions=$functions"
          } >> "$GITHUB_OUTPUT"
      - name: Deploy over SSH
        uses: appleboy/ssh-action@029f5b4aeeeb58fdfe1410a5d17f967dacf36262 # v1.0.3
        env:
          DEPLOY_SHA: ${{ steps.manifest.outputs.commit }}
          ROUTER_IMAGE: ${{ steps.manifest.outputs.router }}
          FUNCTIONS_IMAGE: ${{ steps.manifest.outputs.functions }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          fingerprint: ${{ secrets.SSH_HOST_FINGERPRINT }}
          envs: DEPLOY_SHA,ROUTER_IMAGE,FUNCTIONS_IMAGE
          script: |
            set -e
            cd "${{ secrets.DEPLOY_PATH }}"
            git fetch origin "$DEPLOY_SHA"
            git checkout --detach "$DEPLOY_SHA"
            ./scripts/deploy-transaction.sh staging "$ROUTER_IMAGE" "$FUNCTIONS_IMAGE"
