services:
  ollama:
    build:
      context: ./embed
    profiles: ["gpu"]
    environment:
      OLLAMA_HOST: 0.0.0.0
      OLLAMA_KEEP_ALIVE: 30m
      OLLAMA_NUM_PARALLEL: 2
      OLLAMA_MAX_LOADED_MODELS: 1
    mem_limit: 4g
    volumes:
      - ollama_data:/root/.ollama
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "ollama list | grep -q qwen3-embedding"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 300s
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [ gpu ]
  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru
    mem_limit: 512m
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
  router:
    build:
      context: .
      dockerfile: services/router/Dockerfile
    image: bus-router
    ports:
      - "50051:50051"
      - "8080:8080"
    env_file: ${BUS_ENV_FILE:-./.env}
    environment:
      TZ: Asia/Taipei
      GOMEMLIMIT: ${ROUTER_GOMEMLIMIT:-230MiB}
      REDIS_ADDR: redis:6379
    volumes:
      - router_keys:/data
      - ./secrets:/run/secrets:ro
    mem_limit: ${ROUTER_MEM_LIMIT:-256m}
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/api/.well-known/jwks.json || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
  functions:
    build:
      context: .
      dockerfile: services/functions/Dockerfile
    image: bus-functions
    env_file: ${BUS_ENV_FILE:-./.env}
    environment:
      TZ: Asia/Taipei
      GOMEMLIMIT: ${FUNCTIONS_GOMEMLIMIT:-896MiB}
      REDIS_ADDR: redis:6379
    volumes:
      - ./secrets:/run/secrets:ro
    mem_limit: ${FUNCTIONS_MEM_LIMIT:-1g}
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
  ingestor:
    build:
      context: .
      dockerfile: services/functions/Dockerfile
    image: bus-functions
    env_file: ${BUS_ENV_FILE:-./.env}
    environment:
      TZ: Asia/Taipei
      GOMEMLIMIT: ${INGESTOR_GOMEMLIMIT:-460MiB}
      REDIS_ADDR: redis:6379
      ROLE: ingestor
      INGEST_DB_MAX_CONNS: "1"
    volumes:
      - ./secrets:/run/secrets:ro
    mem_limit: ${INGESTOR_MEM_LIMIT:-512m}
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
  loader:
    build:
      context: .
      dockerfile: services/functions/Dockerfile
    image: bus-functions
    env_file: ${BUS_ENV_FILE:-./.env}
    environment:
      TZ: Asia/Taipei
      GOMEMLIMIT: ${LOADER_GOMEMLIMIT:-460MiB}
      REDIS_ADDR: redis:6379
      ROLE: loader
      LOAD_DB_MAX_CONNS: "1"
    volumes:
      - ./secrets:/run/secrets:ro
    mem_limit: ${LOADER_MEM_LIMIT:-512m}
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
  powersync:
    image: journeyapps/powersync-service:latest
    ports:
      - "8081:8080"
    volumes:
      - ./powersync/config.yaml:/config/config.yaml:ro
      - ./powersync/sync-rules.yaml:/config/sync-rules.yaml:ro
    env_file: ${BUS_ENV_FILE:-./.env}
    environment:
      TZ: Asia/Taipei
      POWERSYNC_CONFIG_PATH: /config/config.yaml
      POWERSYNC_SYNC_RULES_PATH: /config/sync-rules.yaml
    mem_limit: 512m
    depends_on:
      router:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:8080/api/status || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
  osrm:
    image: osrm/osrm-backend
    ports:
      - "127.0.0.1:5000:5000"
    volumes:
      - ./osrm-data:/data:ro
    command: >
      osrm-routed
        --algorithm mld
        --max-table-size 10000
        /data/${OSRM_FILE:-taiwan.osrm}
    mem_limit: 1536m
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:5000/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
volumes:
  redis_data:
  ollama_data:
  router_keys:
