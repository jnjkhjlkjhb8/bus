# Container hardening (all services except the one-shot osrm-fetch/osrm-init
# jobs, which need a writable root to `apk`-free wget/sha256sum into the
# shared ./osrm-data volume): no-new-privileges, all Linux capabilities
# dropped, read-only root filesystem with an explicit tmpfs/volume for the
# one path each service actually writes, and pids/cpu ceilings so a runaway
# process can't take down the 6 GB host. Memory budget (default profile,
# excludes the opt-in `gpu` profile's ollama, which targets a separate,
# GPU-equipped host): router 256m + functions 768m + ingestor 384m +
# loader 384m + redis 512m + powersync 384m + osrm 2048m = 4736m, leaving
# ~1.4 GB of headroom on the 6 GB host for the OS and Docker daemon. The
# ingestor and loader are cron-driven and idle between runs, so the ceilings
# above are not all claimed at once.
services:
  ollama:
    build:
      context: ./embed
    profiles: ["gpu"]
    environment:
      OLLAMA_HOST: 0.0.0.0
      # Keep the embedding model resident indefinitely. Its two callers are
      # the nightly changetovector run and the router's semantic search
      # fallback, which only fires when text search matches nothing — far
      # rarer than any finite idle timeout, so the model was reloaded on
      # almost every fallback. A cold load measures ~30s against the router's
      # 5s request budget; a warm call, ~0.4s.
      OLLAMA_KEEP_ALIVE: -1
      OLLAMA_NUM_PARALLEL: 2
      OLLAMA_MAX_LOADED_MODELS: 1
      OLLAMA_LLM_LIBRARY: cuda_v12
    mem_limit: 4g
    pids_limit: 4096
    cpus: 2.0
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:size=256m
    volumes:
      - ollama_data:/home/ollama/.ollama
    networks:
      - backend
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "ollama list | grep -q qwen3-embedding"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 300s
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [ gpu ]
  redis:
    image: redis:7-alpine@sha256:6ab0b6e7381779332f97b8ca76193e45b0756f38d4c0dcda72dbb3c32061ab99
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru --requirepass "${REDIS_PASSWORD:-}"
    networks:
      - backend
    # The official entrypoint normally drops from root to uid 999 itself via
    # setpriv, which needs CAP_SETUID/CAP_SETGID -- capabilities cap_drop:
    # ALL removes. Starting directly as uid 999 (the image's built-in
    # "redis" user) skips that step entirely instead of clawing back a
    # capability just to drop it again.
    user: "999:999"
    mem_limit: 512m
    pids_limit: 64
    cpus: 0.5
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:size=16m
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
  router:
    build:
      context: .
      dockerfile: services/router/Dockerfile
    # ROUTER_IMAGE lets a deploy pin an exact CI-built digest
    # (ghcr.io/.../bus-router@sha256:...) via `docker compose pull` without a
    # host build; build: above stays so a bare `docker compose up --build`
    # (local dev, make up-test) keeps working unchanged (compose permits
    # build + image together -- image just names what gets built/pulled).
    image: ${ROUTER_IMAGE:-router}
    ports:
      - "${BIND_HOST:-127.0.0.1}:${GRPC_PORT:-50051}:50051"
      - "${BIND_HOST:-127.0.0.1}:${ROUTER_HTTP_PORT:-8080}:8080"
    # ENV_FILE_ROUTER is router's own allowlisted env file, rendered by
    # scripts/render-env.sh from the operator's single env/<env>.env (see
    # Makefile render-env-% and docs/config.md). The ${ENV_FILE:-./.env}
    # fallback is what check-compose-isolation.sh / check-container-
    # hardening.sh (which only ever set ENV_FILE) and an ad-hoc `docker
    # compose up` without a Makefile target still resolve to.
    env_file: ${ENV_FILE_ROUTER:-${ENV_FILE:-./.env}}
    environment:
      TZ: Asia/Taipei
      GOMEMLIMIT: ${ROUTER_GOMEMLIMIT:-230MiB}
      REDIS_ADDR: redis:6379
    # frontend: reachable by/reaches powersync (jwks_uri in powersync/
    # config.yaml points at router). backend: redis, DB (via DATABASE_URL,
    # external), and the ollama embedding proxy. routing: osrm (MaaS/nearby
    # walking directions) -- router is the only service that talks to osrm,
    # so osrm stays off backend/frontend entirely (O7 / review_results.md
    # P2-03 network segmentation).
    networks:
      - frontend
      - backend
      - routing
    volumes:
      # Only /data is writable — that's where the router persists its
      # PowerSync RSA signing key (persistKeyAtomically in http.go writes a
      # same-directory temp file then renames it into place). Everything
      # else the router reads is either baked into the image or injected via
      # env vars, so the rest of the root filesystem stays read-only.
      - router_keys:/data
    mem_limit: ${ROUTER_MEM_LIMIT:-256m}
    pids_limit: 128
    cpus: 1.0
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/api/.well-known/jwks.json || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
  functions:
    build:
      context: .
      dockerfile: services/functions/Dockerfile
    # FUNCTIONS_IMAGE is shared by functions/ingestor/loader (one image, three
    # ROLE values) -- see the ROUTER_IMAGE comment above for why build: and
    # image: coexist.
    image: ${FUNCTIONS_IMAGE:-functions}
    env_file: ${ENV_FILE_FUNCTIONS:-${ENV_FILE:-./.env}}
    environment:
      TZ: Asia/Taipei
      GOMEMLIMIT: ${FUNCTIONS_GOMEMLIMIT:-680MiB}
      REDIS_ADDR: redis:6379
    networks:
      - backend
    # TDXClient.GetInto (services/shared/tdx.go) spools each response to
    # os.CreateTemp("", ...), i.e. the default $TMPDIR (/tmp) — that's the
    # only path this binary writes to. touchHealthFile (services/functions/
    # healthfile.go) also writes its liveness marker here on every cron tick.
    tmpfs:
      - /tmp:size=256m
    mem_limit: ${FUNCTIONS_MEM_LIMIT:-768m}
    pids_limit: 128
    cpus: 1.0
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      # This role's fastest cron (mrtEta) ticks every 10s, so a marker older
      # than 2 minutes means the scheduler loop has stalled -- addStaticCron
      # touches /tmp/healthy after every job returns, success or failure
      # (services/functions/healthfile.go), so this proves cron dispatch is
      # alive, not that any single TDX-dependent job succeeded.
      test: ["CMD-SHELL", "find /tmp/healthy -mmin -2 2>/dev/null | grep -q ."]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
  ingestor:
    build:
      context: .
      dockerfile: services/functions/Dockerfile
    image: ${FUNCTIONS_IMAGE:-functions}
    env_file: ${ENV_FILE_INGESTOR:-${ENV_FILE:-./.env}}
    environment:
      TZ: Asia/Taipei
      GOMEMLIMIT: ${INGESTOR_GOMEMLIMIT:-345MiB}
      REDIS_ADDR: redis:6379
      ROLE: ingestor
      INGEST_DB_MAX_CONNS: "1"
      TMPDIR: /spool
    networks:
      - backend
    volumes:
      - ingestor_spool:/spool
    tmpfs:
      - /tmp:size=64m
    mem_limit: ${INGESTOR_MEM_LIMIT:-384m}
    pids_limit: 128
    cpus: 0.5
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      # ingestor only runs its landing job once a day (03:00), so a
      # touch-file freshness check (as functions above uses) would report
      # unhealthy for the ~23.5 idle hours between ticks. Just prove the
      # process itself is alive.
      # busybox pgrep's -x matches the full command line (e.g. "./functions
      # run changetovector"), not just the process name, so it never matches
      # plain "functions" -- verified against this image directly. The
      # unqualified pgrep matches by process name (comm), which is exactly
      # "functions" for this binary.
      test: ["CMD-SHELL", "pgrep functions"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
  loader:
    build:
      context: .
      dockerfile: services/functions/Dockerfile
    image: ${FUNCTIONS_IMAGE:-functions}
    env_file: ${ENV_FILE_LOADER:-${ENV_FILE:-./.env}}
    environment:
      TZ: Asia/Taipei
      GOMEMLIMIT: ${LOADER_GOMEMLIMIT:-345MiB}
      REDIS_ADDR: redis:6379
      ROLE: loader
      LOAD_DB_MAX_CONNS: "1"
      PG_STATEMENT_TIMEOUT: 600s
    networks:
      - backend
    tmpfs:
      - /tmp:size=256m
    mem_limit: ${LOADER_MEM_LIMIT:-384m}
    pids_limit: 128
    cpus: 0.5
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      # Daily cron like ingestor above -- process-alive only, not freshness.
      # busybox pgrep's -x matches the full command line (e.g. "./functions
      # run changetovector"), not just the process name, so it never matches
      # plain "functions" -- verified against this image directly. The
      # unqualified pgrep matches by process name (comm), which is exactly
      # "functions" for this binary.
      test: ["CMD-SHELL", "pgrep functions"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
  powersync:
    image: journeyapps/powersync-service:1.23.3@sha256:b6b22fa7d0d862f04bdff62846e656756d17bcf3dd6eca399a0633671051438b
    ports:
      - "${BIND_HOST:-127.0.0.1}:${POWERSYNC_PORT:-8081}:8080"
    volumes:
      - ./powersync/config.yaml:/config/config.yaml:ro
      - ./powersync/sync-rules.yaml:/config/sync-rules.yaml:ro
    env_file: ${ENV_FILE_POWERSYNC:-${ENV_FILE:-./.env}}
    environment:
      TZ: Asia/Taipei
      POWERSYNC_CONFIG_PATH: /config/config.yaml
      POWERSYNC_SYNC_RULES_PATH: /config/sync-rules.yaml
    # frontend only: powersync replicates from Postgres directly
    # (PS_SOURCE_DATABASE_URL, external) and calls router's jwks_uri over
    # frontend -- it never touches Redis, so it has no reason to be on
    # backend (O7 / review_results.md P2-03).
    networks:
      - frontend
    tmpfs:
      - /tmp:size=64m
    mem_limit: 384m
    pids_limit: 256
    cpus: 0.5
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    depends_on:
      router:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      # The image ships neither curl nor wget, and /api/status is a 404 — the
      # service exposes /probes/readiness. node is the only HTTP client present.
      test: ["CMD", "node", "-e", "fetch('http://localhost:8080/probes/readiness').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
  osrm-fetch:
    image: alpine:3.23@sha256:fd791d74b68913cbb027c6546007b3f0d3bc45125f797758156952bc2d6daf40
    volumes:
      - ./osrm-data:/data
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 32
    cpus: 0.5
    entrypoint: ["/bin/sh", "-c"]
    # Downloads to a same-directory temp file, verifies it against a
    # checksum before it is ever trusted, and only then renames it into
    # place atomically (rename is atomic within one filesystem, so a reader
    # never observes a partial/corrupt PBF and a failed verify never
    # clobbers a good previous download). Geofabrik publishes MD5 checksums
    # for its extracts, not SHA256 (verified against
    # download.geofabrik.de/asia/taiwan-latest.osm.pbf.sha256 returning 404
    # while .md5 returns 200) — MD5 is the strongest integrity check
    # Geofabrik itself offers for this file, so that's what's verified here.
    # OSRM_PBF_URL defaults to the `-latest` alias, and OSRM_PBF_MD5 (when
    # unset) is fetched from that alias's `.md5` sidecar at run time — unlike
    # `-latest.osm.pbf`, the `.md5` sidecar resolves directly (200, no
    # redirect) so it always matches whatever `-latest` currently points to.
    # This avoids pinning a dated snapshot filename, which 404s once
    # Geofabrik rotates it out of their retention window. Set both
    # OSRM_PBF_URL and OSRM_PBF_MD5 to pin a specific reproducible extract.
    command:
      - >
        set -e; cd /data;
        target="${OSRM_PBF_FILE:-taiwan.osm.pbf}";
        url="${OSRM_PBF_URL:-https://download.geofabrik.de/asia/taiwan-latest.osm.pbf}";
        expected_md5="${OSRM_PBF_MD5:-}";
        if [ -z "$$expected_md5" ]; then
          expected_md5="$$(wget -qO- "$$url.md5" | cut -d' ' -f1)";
        fi;
        if [ -f "$$target" ] && [ "$$(md5sum "$$target" | cut -d' ' -f1)" = "$$expected_md5" ]; then
          echo "osrm-fetch: $$target already present and verified"; exit 0;
        fi;
        tmp="$$target.tmp-$$$$";
        wget -O "$$tmp" "$$url";
        actual_md5="$$(md5sum "$$tmp" | cut -d' ' -f1)";
        if [ "$$actual_md5" != "$$expected_md5" ]; then
          echo "osrm-fetch: checksum mismatch for $$url: expected $$expected_md5 got $$actual_md5" >&2;
          rm -f "$$tmp"; exit 1;
        fi;
        mv "$$tmp" "$$target";
        echo "osrm-fetch: downloaded and verified $$target (md5 $$actual_md5)"
    restart: "no"
    # routing: this one-shot job needs internet egress to Geofabrik, which
    # any bridge network provides regardless of name; grouping it with osrm
    # keeps it out of backend/frontend, where it has no reason to be.
    networks:
      - routing
  osrm-init:
    image: osrm/osrm-backend:v5.25.0@sha256:bdfa60e64ae1376bff6ff5605991be50600132a27469a4a9e77c23afd3a6d555
    depends_on:
      osrm-fetch:
        condition: service_completed_successfully
    volumes:
      - ./osrm-data:/data
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 512
    cpus: 2.0
    entrypoint: ["/bin/sh", "-c"]
    # The marker is content-based: sha256(pbf) + profile name, not a bare
    # "foot" flag. A stale marker (old PBF re-fetched under the same
    # filename, or a profile change) no longer looks identical, so
    # preprocessing reruns instead of silently serving routes over
    # yesterday's map.
    command:
      - >
        set -e; cd /data;
        pbf="${OSRM_PBF_FILE:-taiwan.osm.pbf}";
        profile="foot";
        osrm_base="$${pbf%.osm.pbf}.osrm";
        marker_file="$${pbf%.osm.pbf}.osrm.marker";
        pbf_sha256="$$(sha256sum "$$pbf" | cut -d' ' -f1)";
        want_marker="$${pbf_sha256}:$${profile}";
        if [ -f "$$marker_file" ] && [ "$$(cat "$$marker_file")" = "$$want_marker" ]; then
          echo "osrm-init: preprocessing already up to date for $$pbf ($$profile)";
        else
          osrm-extract -p /opt/foot.lua "$$pbf" &&
          osrm-partition "$$osrm_base" &&
          osrm-customize "$$osrm_base" &&
          echo "$$want_marker" > "$$marker_file";
        fi;
        chmod -R a+rX .
    restart: "no"
    networks:
      - routing

  osrm:
    image: osrm/osrm-backend:v5.25.0@sha256:bdfa60e64ae1376bff6ff5605991be50600132a27469a4a9e77c23afd3a6d555
    depends_on:
      osrm-init:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:${OSRM_PORT:-5000}:5000"
    volumes:
      - ./osrm-data:/data:ro
    # osrm-routed is a pure reader once preprocessing has run (mmaps the
    # .osrm files read-only) and the upstream image otherwise runs as root
    # with no built-in privilege drop, so pin it to nobody explicitly.
    user: "65534:65534"
    networks:
      - routing
    command: >
      osrm-routed
        --algorithm mld
        --max-table-size 10000
        /data/${OSRM_FILE:-taiwan.osrm}
    # osrm-routed mmaps the .osrm files, and the cgroup counts those pages as
    # its own: a limit under the ~1.2 GB on-disk set made every table query
    # re-fault its cells in from disk. Sized above the data so the working set
    # stays resident. Two cores because a nearby query is a single table
    # request over up to ~400 destinations.
    mem_limit: 2048m
    pids_limit: 64
    cpus: 2.0
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:size=16m
    restart: unless-stopped
    healthcheck:
      # osrm-routed has no /health endpoint; probe a real OSRM HTTP API
      # route (nearest) against a coordinate inside Taiwan and check for a
      # successful "Ok" response. The pinned Debian-based image ships no
      # wget/curl/busybox, but it does have bash, so the HTTP request goes
      # over bash's /dev/tcp redirection instead (verified to execute
      # inside osrm/osrm-backend:v5.25.0 -- connection-refused without a
      # server, exit 0 against a stubbed "code":"Ok" response).
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/localhost/5000 && printf 'GET /nearest/v1/foot/121.5654,25.0330 HTTP/1.0\\r\\nHost: localhost\\r\\n\\r\\n' >&3 && grep -q '\"code\":\"Ok\"' <&3"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
volumes:
  redis_data:
  ollama_data:
  router_keys:
  ingestor_spool:

# O7 / review_results.md P2-03 network segmentation: frontend carries only
# router (gRPC/HTTP ingress) and powersync (edge-proxied sync); backend
# carries router plus everything that needs Redis or talks to Postgres
# (functions, ingestor, loader, the opt-in ollama embedding proxy); routing
# is router plus osrm's three services, kept off backend/frontend since
# nothing there needs Redis, the DB, or a client-facing address. A
# compromised functions/ingestor/loader container therefore cannot reach
# powersync or osrm, and a compromised powersync cannot reach Redis, the
# ingestion pipeline, or osrm. Only router spans all three, by necessity (it
# is the shared dependency of every other network).
networks:
  frontend:
  backend:
  routing:
