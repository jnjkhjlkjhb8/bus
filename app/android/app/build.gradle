plugins {
    id("com.android.application")
    id("dev.flutter.flutter-gradle-plugin")
    id("com.google.gms.google-services")
    id("com.google.firebase.crashlytics")
    id("com.google.firebase.firebase-perf")
}

def googleMapsApiKey = project.hasProperty('GOOGLE_MAPS_API_KEY') ? GOOGLE_MAPS_API_KEY : ''
def localPropertiesFile = rootProject.file('local.properties')
if (!googleMapsApiKey && localPropertiesFile.exists()) {
    localPropertiesFile.eachLine { line ->
        if (line.startsWith('GOOGLE_MAPS_API_KEY=')) {
            googleMapsApiKey = line.substring('GOOGLE_MAPS_API_KEY='.length()).trim()
        }
    }
}

def dartEnvironmentVariables = [
    GOOGLE_MAPS_API_KEY: googleMapsApiKey,
]

android {
    namespace = "com.example.bus"
    compileSdk = flutter.compileSdkVersion
    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }
    defaultConfig {
        // TODO: Specify your own unique Application ID (https://developer.android.com/studio/build/application-id.html).
        applicationId "com.wheres.bus"
        // You can update the following values to match your application needs.
        // For more information, see: https://flutter.dev/to/review-gradle-config.
        minSdk = flutter.minSdkVersion
        targetSdk = flutter.targetSdkVersion
        versionCode = flutter.versionCode
        versionName = flutter.versionName
        resValue("string", "google_maps_api_key", dartEnvironmentVariables.GOOGLE_MAPS_API_KEY ?: "")
    }
    kotlinOptions {
        jvmTarget = "17"
    }
    buildTypes {
        release {
            // TODO: Add your own signing config for the release build.
            // Signing with the debug keys for now, so `flutter run --release` works.
            signingConfig = signingConfigs.getByName("debug")
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
        }
    }
}
flutter {
    source = "../.."
}
